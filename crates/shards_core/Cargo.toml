[package]
name = "shards_core"
description = "Shards engine core: config, engine states, the loading gate, Intent and orders, engine modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A shipped build: the engine's own invariant rules are off by default (`EngineConfig::engine_invariants`).
dist = []

[dependencies]
ai_core.workspace = true
bevy = { workspace = true, features = ["std", "bevy_state", "serialize"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
