# Records the reference replays again on Linux, where CI verifies them, and hands them back as an
# artifact. Since E10.6 the simulation's maths goes through libm, the same on Windows and Linux
# (x86_64), and both record byte-identical replays (docs/manual.md, "Time and determinism"): the
# checked-in ones may come from either OS, and this workflow is one way to get them. Other CPUs,
# macOS and ARM are not checked.
#
# After a deliberate change of gameplay or content: push a commit whose message contains
# `[record replays]` (or run this workflow by hand once it is on the default branch), then
#   gh run download <run id> --name reference-replays --dir .
#   git add tests/replays template/tests/replays && git commit
# The artifact holds both folders at their places in the repository.

name: record replays

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

defaults:
  run:
    shell: bash

jobs:
  record:
    name: record
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[record replays]')
    # On the job, not the workflow: every push starts this workflow, and a push without the tag
    # (its job skipped) must not cancel a recording that is running.
    concurrency:
      group: record-replays-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: dev
          save: "false"
      - name: Record the sandbox's reference replays
        run: cargo test -p sandbox --test sandbox --locked -- --ignored record_reference_replays
      - name: Record the template's reference replays
        run: cargo test --manifest-path template/Cargo.toml --test game --locked -- --ignored record_reference_replays
      # What a later CI run checks them with, before anyone downloads them.
      - name: The new replays verify
        run: |
          cargo test -p sandbox --test sandbox --locked reference_replays
          cargo test --manifest-path template/Cargo.toml --test game --locked reference_replays
      - uses: actions/upload-artifact@v4
        with:
          name: reference-replays
          path: |
            tests/replays/*.json
            template/tests/replays/*.json
          if-no-files-found: error
