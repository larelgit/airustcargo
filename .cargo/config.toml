[build]
# Four parallel jobs is the safe default for a small or shared machine: a test build of the whole
# workspace with sixteen jobs ran out of memory next to other builds (rustc "memory allocation failed",
# rust-lld exit 0xc000001d). With free RAM, raise it for the run: `CARGO_BUILD_JOBS=12 cargo build`
# (env beats this line). Measured: a cold sandbox build took 16 min with 4 jobs and 7.5 min with 12
# ("Building and iterating fast", docs/manual.md).
jobs = 4

[target.x86_64-pc-windows-msvc]
# rust-lld ships with the Rust toolchain (rustlib/x86_64-pc-windows-msvc/bin) and links the sandbox in
# about 3 s instead of 7 s with MSVC's link.exe; the code the compiler generates is the same (the
# reference replays are byte-identical). The environment overrides this line:
# `CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=link.exe`.
linker = "rust-lld"

[alias]
# `cargo shards observe`, `cargo shards step 120`, ...
shards = "run -q -p shards_cli --"
# `cargo sandbox` (window) / `cargo sandbox --headless --paused`
sandbox = "run -p sandbox --"
