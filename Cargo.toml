[workspace]
resolver = "3"
members = [
    "crates/ai_core",
    "crates/shards_script",
    "crates/shards_core",
    "crates/shards_content",
    "crates/shards_motion",
    "crates/shards_action",
    "crates/shards_level",
    "crates/shards_npc",
    "crates/shards",
    "crates/sandbox",
    "crates/shards_cli",
]
# A separate workspace on purpose: it depends on `shards` alone, like a game in its own repo.
exclude = ["template"]
default-members = ["crates/sandbox", "crates/shards_cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
# Bevy is pinned to the 0.20 line on purpose: minor releases break APIs.
# Upgrade deliberately (read the migration guide), never via `cargo update` alone.
bevy = { version = "0.20.0", default-features = false }
bevy_remote = { version = "0.20.0", default-features = false, features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
clap = { version = "4.6", features = ["derive", "env"] }
ureq = { version = "3.4", default-features = false, features = ["json"] }
libc = "0.2"
# Content files (RON definitions and prefabs).
ron = "=0.12.2"
# Collision queries inside shards_motion only; never part of a public API. `alloc` holds
# the support-map shape casts and EPA contacts. No `enhanced-determinism`: it switches
# glam (shared with all of Bevy) to scalar libm math; one machine + one build is already
# deterministic, which is what replays need.
parry3d = { version = "=0.31.1", default-features = false, features = ["std", "alloc", "dim3", "f32"] }
# Reads level files (Blender's glTF export) inside shards_level only; never part of a public API.
# The JSON alone is enough (node tree, transforms, names, extras, POSITION bounds): no `import`
# feature, so no image decoders. Bevy's own glTF loader uses the same crate for the visuals.
gltf = { version = "=1.4.1", default-features = false, features = ["names", "extras"] }

ai_core = { path = "crates/ai_core", default-features = false }
shards_script = { path = "crates/shards_script" }
shards_core = { path = "crates/shards_core" }
shards_content = { path = "crates/shards_content", default-features = false }
shards_motion = { path = "crates/shards_motion" }
shards_action = { path = "crates/shards_action" }
shards_level = { path = "crates/shards_level" }
shards_npc = { path = "crates/shards_npc" }
shards = { path = "crates/shards", default-features = false }

# Bevy's recommended dev setup: optimise dependencies, keep our own code fast to compile.
[profile.dev]
opt-level = 1
# Line tables keep backtraces readable; full debug info made every test binary ~330 MB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
