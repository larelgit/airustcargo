[package]
name = "shards_ui"
description = "Shards UI (E9): screens and widgets from content, a screen stack with focus and navigation, the UI tree for agents (observe, ui_* tools), drawn with Bevy UI when there is a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Drawing the screens with Bevy UI, the mouse (picking) and screen readers (AccessKit). The model,
# the tools and the navigation are always built: a headless game has its screens too.
render = ["ai_core/render", "bevy/bevy_ui", "bevy/bevy_text", "bevy/bevy_window", "bevy/ui_picking", "bevy/bevy_input_focus", "dep:accesskit"]

[dependencies]
ai_core.workspace = true
shards_core.workspace = true
shards_content.workspace = true
shards_settings.workspace = true
# Text that names a message (`@menu-resume`) is shown in the language played.
shards_locale.workspace = true
bevy = { workspace = true, features = ["std", "serialize", "bevy_state"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# Labels, roles and values for screen readers, the version Bevy's own accessibility uses (it no
# longer re-exports the crate); inside shards_ui only, never part of a public API.
accesskit = { workspace = true, optional = true }

[dev-dependencies]
# The drawing tests read what screen readers get.
accesskit.workspace = true
# The content tests read RON as the content database does.
ron.workspace = true
# Integration tests build apps the way a game does: the whole engine (`shards::testing`).
shards = { workspace = true, features = ["render", "remote", "hot_reload"] }
