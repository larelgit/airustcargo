# Determinism guard (README, "Время и детерминизм"). The simulation must give the same bits on Windows,
# Linux and macOS, but std's `f32::sin`, `f32::exp`, `f32::powf` and the rest call the platform's C math
# library, whose last bits differ between MSVC, glibc and the others. `bevy::math::ops` (in the Bevy prelude
# as `ops`) takes the same functions from the pure-Rust `libm` crate (the `libm` feature of `bevy` in the
# workspace Cargo.toml), so a replay recorded on one OS replays on another. The list mirrors Bevy's own
# clippy.toml; `template/clippy.toml` is a copy of this file (clippy takes the nearest file and does not merge).
#
# Not on the list, because their result is exact: `sqrt`, `abs`, `floor`, `ceil`, `round`, `fract`, `mul_add`,
# `rem_euclid`, `to_radians`, `to_degrees`, `min`, `max`, `clamp`.
disallowed-methods = [
  { path = "f32::powi", reason = "use bevy::math::ops::FloatPow::squared, bevy::math::ops::FloatPow::cubed, or bevy::math::ops::powf instead for libm determinism" },
  { path = "f32::log", reason = "use bevy::math::ops::ln, bevy::math::ops::log2, or bevy::math::ops::log10 instead for libm determinism" },
  { path = "f32::abs_sub", reason = "deprecated and deeply confusing method" },
  { path = "f32::powf", reason = "use bevy::math::ops::powf instead for libm determinism" },
  { path = "f32::exp", reason = "use bevy::math::ops::exp instead for libm determinism" },
  { path = "f32::exp2", reason = "use bevy::math::ops::exp2 instead for libm determinism" },
  { path = "f32::ln", reason = "use bevy::math::ops::ln instead for libm determinism" },
  { path = "f32::log2", reason = "use bevy::math::ops::log2 instead for libm determinism" },
  { path = "f32::log10", reason = "use bevy::math::ops::log10 instead for libm determinism" },
  { path = "f32::cbrt", reason = "use bevy::math::ops::cbrt instead for libm determinism" },
  { path = "f32::hypot", reason = "use bevy::math::ops::hypot instead for libm determinism" },
  { path = "f32::sin", reason = "use bevy::math::ops::sin instead for libm determinism" },
  { path = "f32::cos", reason = "use bevy::math::ops::cos instead for libm determinism" },
  { path = "f32::tan", reason = "use bevy::math::ops::tan instead for libm determinism" },
  { path = "f32::asin", reason = "use bevy::math::ops::asin instead for libm determinism" },
  { path = "f32::acos", reason = "use bevy::math::ops::acos instead for libm determinism" },
  { path = "f32::atan", reason = "use bevy::math::ops::atan instead for libm determinism" },
  { path = "f32::atan2", reason = "use bevy::math::ops::atan2 instead for libm determinism" },
  { path = "f32::sin_cos", reason = "use bevy::math::ops::sin_cos instead for libm determinism" },
  { path = "f32::exp_m1", reason = "use bevy::math::ops::exp_m1 instead for libm determinism" },
  { path = "f32::ln_1p", reason = "use bevy::math::ops::ln_1p instead for libm determinism" },
  { path = "f32::sinh", reason = "use bevy::math::ops::sinh instead for libm determinism" },
  { path = "f32::cosh", reason = "use bevy::math::ops::cosh instead for libm determinism" },
  { path = "f32::tanh", reason = "use bevy::math::ops::tanh instead for libm determinism" },
  { path = "f32::asinh", reason = "use bevy::math::ops::asinh instead for libm determinism" },
  { path = "f32::acosh", reason = "use bevy::math::ops::acosh instead for libm determinism" },
  { path = "f32::atanh", reason = "use bevy::math::ops::atanh instead for libm determinism" },
  # `bevy::math::ops` has f32 only. Do the math in f32 (cast the f64 in, cast the result out) so that it comes from libm too.
  # Bring a large f64 into range before the cast (a phase modulo TAU, a clock minus its start): f32 keeps 24 bits and ends at 3.4e38.
  { path = "f64::powi", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::FloatPow::squared or bevy::math::ops::powf for libm determinism" },
  { path = "f64::log", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::ln, log2 or log10 for libm determinism" },
  { path = "f64::abs_sub", reason = "deprecated and deeply confusing method" },
  { path = "f64::powf", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::powf for libm determinism" },
  { path = "f64::exp", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::exp for libm determinism" },
  { path = "f64::exp2", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::exp2 for libm determinism" },
  { path = "f64::ln", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::ln for libm determinism" },
  { path = "f64::log2", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::log2 for libm determinism" },
  { path = "f64::log10", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::log10 for libm determinism" },
  { path = "f64::cbrt", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::cbrt for libm determinism" },
  { path = "f64::hypot", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::hypot for libm determinism" },
  { path = "f64::sin", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::sin for libm determinism" },
  { path = "f64::cos", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::cos for libm determinism" },
  { path = "f64::tan", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::tan for libm determinism" },
  { path = "f64::asin", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::asin for libm determinism" },
  { path = "f64::acos", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::acos for libm determinism" },
  { path = "f64::atan", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::atan for libm determinism" },
  { path = "f64::atan2", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::atan2 for libm determinism" },
  { path = "f64::sin_cos", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::sin_cos for libm determinism" },
  { path = "f64::exp_m1", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::exp_m1 for libm determinism" },
  { path = "f64::ln_1p", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::ln_1p for libm determinism" },
  { path = "f64::sinh", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::sinh for libm determinism" },
  { path = "f64::cosh", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::cosh for libm determinism" },
  { path = "f64::tanh", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::tanh for libm determinism" },
  { path = "f64::asinh", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::asinh for libm determinism" },
  { path = "f64::acosh", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::acosh for libm determinism" },
  { path = "f64::atanh", reason = "bevy::math::ops is f32 only: use f32 and bevy::math::ops::atanh for libm determinism" },
]
