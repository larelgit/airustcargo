[workspace]
resolver = "3"
members = [
    "crates/ai_core",
    "crates/shards_script",
    "crates/shards_core",
    "crates/shards_content",
    "crates/shards_motion",
    "crates/shards_action",
    "crates/shards_level",
    "crates/shards_save",
    "crates/shards_settings",
    "crates/shards_locale",
    "crates/shards_ui",
    "crates/shards_audio",
    "crates/shards_dev",
    "crates/shards_look",
    "crates/shards_scatter",
    "crates/shards_voxel",
    "crates/shards_fx",
    "crates/shards_hitstop",
    "crates/shards_light",
    "crates/shards_rules",
    "crates/shards_npc",
    "crates/shards_encounter",
    "crates/shards_world",
    "crates/shards_net",
    "crates/shards_steam",
    "crates/shards",
    "crates/sandbox",
    "crates/shards_cli",
]
# A separate workspace on purpose: it depends on `shards` alone, like a game in its own repo.
exclude = ["template"]
default-members = ["crates/sandbox", "crates/shards_cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Bevy is pinned to the 0.20 line on purpose: minor releases break APIs.
# Upgrade deliberately (read the migration guide), never via `cargo update` alone.
# `libm`: sin, cos, atan2, exp, powf and the rest come from the pure-Rust `libm` crate (glam and `bevy::math::ops`)
# instead of the platform's C math library, whose last bits differ between MSVC, glibc and macOS. Replays and
# co-op depend on it: the same seed must give the same bits on every OS of one CPU architecture (x86_64: Windows,
# Linux, Steam Deck; see `parry3d` below for why not across architectures). It is here, not in `shards`, so that
# `cargo test -p <any crate>` has it too; the template gets it through `shards`. Game code calls `bevy::math::ops`
# (clippy.toml forbids std's `f32::sin` and friends).
bevy = { version = "0.20.0", default-features = false, features = ["libm"] }
bevy_remote = { version = "0.20.0", default-features = false, features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
clap = { version = "4.6", features = ["derive", "env"] }
ureq = { version = "3.4", default-features = false, features = ["json"] }
libc = "0.2"
# Content files (RON definitions and prefabs).
ron = "=0.12.2"
# Checksums of save files, inside shards_save only.
crc32fast = "=1.5.2"
# Collision queries inside shards_motion only; never part of a public API. `alloc` holds
# the support-map shape casts and EPA contacts. `indexmap`: the hash maps parry iterates become `IndexMap`s.
#
# This is parry's `enhanced-determinism` minus one of its four items. `indexmap` is above; `simba/libm_force`
# and `glamx/libm` come with the `glamx` line below. The fourth, `glamx/scalar-math`, is left out and must stay
# out: it turns glam (shared with all of Bevy) to scalar code, and scalar glam drops the 16-byte alignment of
# `Vec4` and `Mat4`. Bevy 0.20 sizes its GPU mesh buffers by the Rust layout, so `MeshUniform` becomes 168 bytes
# against the shader's 176, wgpu rejects the bind group ("Binding size 168 of Buffer with '' label is less than
# minimum 176") and rendering stops. `shards` refuses that build at compile time (`crates/shards/src/lib.rs`).
# What glam's SIMD gives: the same bits on every OS of one CPU architecture (x86_64: Windows, Linux, Steam Deck),
# because glam's SSE2 code is the same instructions there and only transcendental functions (sin, exp, powf)
# differ between C runtimes, and those come from `libm` (checked by a run: Windows 11 and Ubuntu 24.04 under
# WSL1 record the same reference replays byte for byte, on one machine, so one CPU; other x86_64 CPUs, macOS,
# ARM and Steam Deck hardware are not checked). Across
# architectures (x86_64 against ARM, Apple Silicon) it is not promised: NEON fuses multiply-adds where SSE2
# rounds twice. Nor with `-C target-cpu=native` or `+fma`: under `target_feature = "fma"` glam's SSE2 code
# fuses them too (`Quat` products and `slerp`, `Vec3A::cross` and `slerp`, `lerp_monotonic` and `mul_add` of
# `Vec3A` and `Vec4`).
parry3d = { version = "=0.31.1", default-features = false, features = ["std", "alloc", "dim3", "f32", "indexmap"] }
# Inside shards_motion only, for one feature; never imported, never part of a public API. glamx is parry's
# math layer: `libm` makes it and simba (`simba/libm_force`) take sqrt, sin, atan2, powf and the rest from the
# pure-Rust `libm` crate, as `enhanced-determinism` would, but without `scalar-math` (see `parry3d` above).
# Pinned to the version parry 0.31.1 resolves to; move it together with parry.
glamx = { version = "=0.3.1", default-features = false, features = ["libm"] }
# Reads level files (Blender's glTF export) inside shards_level only; never part of a public API.
# The JSON alone is enough (node tree, transforms, names, extras, POSITION bounds): no `import`
# feature, so no image decoders. Bevy's own glTF loader uses the same crate for the visuals.
gltf = { version = "=1.4.1", default-features = false, features = ["names", "extras"] }
# Reads `settings.toml` inside shards_settings only (Bevy's settings framework reads it with the
# same crate, so nothing new is built); never part of a public API.
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse", "display"] }
# Deflate of link bodies and blobs inside shards_net only; never part of a public API. Pure Rust
# (miniz_oxide), raw deflate streams: no zlib header, no C or SIMD backends.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Labels, roles and values of UI widgets for screen readers, inside shards_ui only; never part of a
# public API. The version Bevy 0.20's own accessibility uses (`bevy_a11y`, `bevy_winit`): one copy.
accesskit = { version = "=0.24.1", default-features = false }
# Text of games in many languages (Fluent: messages with parameters, plurals per language), inside
# shards_locale only; never part of a public API.
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
unic-langid = "=0.9.6"
# The language of the user's interface, which a game takes at its first run, inside shards_locale only;
# never part of a public API. The version Bevy 0.20's text already reads it with (`bevy_text`): one copy.
sys-locale = "=0.3.2"
# Reads the engine's default font in shards_ui's tests (which letters it has); a dev-dependency only. The
# version Bevy 0.20's font stack already has (`parley`): one copy.
ttf-parser = "=0.25.1"
# Sets the window's icon inside `shards` only (`window_icon.rs`); never part of a public API. The version
# Bevy 0.20 opens its windows with (`bevy_winit`): one copy, its features.
winit = { version = "=0.30.13", default-features = false }
# Steamworks (lobbies, the relay, achievements, cloud) inside shards_steam only, behind its feature
# `sdk` (`shards/steam_sdk`); never part of a public API, never in a default build. Pins
# steamworks-sys 0.13 (Valve's SDK 1.64, bindings pre-generated: no bindgen, no libclang). `raw-bindings`: the
# calls the crate does not wrap, or wraps so that an answer is lost or a value Steam sends panics (a friend
# invited into a lobby, a session's route, sessions closed, a cloud file written whole, the quota, callbacks).
steamworks = { version = "=0.13.1", default-features = false, features = ["raw-bindings"] }

ai_core = { path = "crates/ai_core", default-features = false }
shards_script = { path = "crates/shards_script" }
shards_core = { path = "crates/shards_core" }
shards_content = { path = "crates/shards_content", default-features = false }
shards_motion = { path = "crates/shards_motion" }
shards_action = { path = "crates/shards_action" }
shards_level = { path = "crates/shards_level" }
shards_npc = { path = "crates/shards_npc" }
shards_encounter = { path = "crates/shards_encounter" }
shards_save = { path = "crates/shards_save" }
shards_settings = { path = "crates/shards_settings" }
shards_locale = { path = "crates/shards_locale" }
shards_ui = { path = "crates/shards_ui" }
shards_audio = { path = "crates/shards_audio" }
shards_dev = { path = "crates/shards_dev" }
shards_look = { path = "crates/shards_look" }
shards_scatter = { path = "crates/shards_scatter" }
shards_voxel = { path = "crates/shards_voxel" }
shards_fx = { path = "crates/shards_fx" }
shards_hitstop = { path = "crates/shards_hitstop" }
shards_light = { path = "crates/shards_light" }
shards_rules = { path = "crates/shards_rules" }
shards_world = { path = "crates/shards_world" }
shards_net = { path = "crates/shards_net" }
shards_steam = { path = "crates/shards_steam" }
shards = { path = "crates/shards", default-features = false }

# Bevy's recommended dev setup: optimise dependencies, keep our own code fast to compile.
[profile.dev]
opt-level = 1
# Line tables keep backtraces readable; full debug info made every test binary ~330 MB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
