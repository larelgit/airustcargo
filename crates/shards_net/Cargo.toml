[package]
name = "shards_net"
description = "Shards networking: transports (in-memory hub, UDP), the link layer, and the co-op session on top (join, inputs, state replication, desync check, the in-process stand)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# A client's window: others' entities blended between the host's states (`interp`), the net
# overlay's text. The buffer math and the `net_overlay` tool are always built.
render = ["ai_core/render", "bevy/bevy_text", "bevy/bevy_ui"]

[dependencies]
ai_core.workspace = true
shards_core.workspace = true
shards_content.workspace = true
bevy = { workspace = true, features = ["std", "serialize", "bevy_state"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
flate2.workspace = true
