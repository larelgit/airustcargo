# Engine CI: every pull request, every push to main, release tags (`v*`), and by hand.
#
#   test           cargo nextest run --workspace (profile ci): unit tests, sandbox scenarios, checked-in
#                  replays; the sandbox's tick-time tests alone; doctests
#   clippy         warnings are errors, engine and template
#   template       the template game builds and passes its tests (nextest) apart from the workspace
#   headless-cli   a live sandbox without a window, driven by the `shards` CLI; content and
#                  1000-seed worldgen checks through the game's binary; live stands (a host and
#                  clients, `--stand N`) running the stand scenarios, each on the links its
#                  `stand` line names, and a three-minute soak on E7's stand
#   replays-window the same replays verified with a window (Xvfb + software Vulkan); optional
#
# Elsewhere: nightly.yml (the long checks, every night), soak.yml (half an hour of a live stand, every
# night), cross.yml (Windows and Ubuntu 22.04 verify the reference replays, weekly), record-replays.yml (the reference
# replays recorded again on Linux, on demand).
#
# What the jobs run you can run by hand: the commands are the same.

name: CI

on:
  # A push to a branch with a pull request is checked once, by the pull request's run (which tests the
  # merge with the base): a run on the push as well ran the whole of CI twice for every push. A branch with
  # no pull request: `gh workflow run CI --ref BRANCH`.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only slows a clean CI build down and bloats the cache.
  CARGO_INCREMENTAL: 0
  # One Bevy build per cache: the template reuses the engine workspace's `target/`.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: dev
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      # Includes the sandbox's scenario files (crates/sandbox/scenarios/*.scenario, and the stand
      # scenarios in scenarios/stand/ on in-process stands) and the checked-in replays (--verify),
      # which are tests there. Profile `ci` (.config/nextest.toml): two retries, and a test that
      # passes only on a retry fails the run. The sandbox's `perf` binary measures wall time, so it
      # is left out here and runs alone below.
      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace --locked --profile ci -E 'not binary_id(sandbox::perf)'
      # Tick-time tests: one at a time, nothing else running (profile `ci-perf` keeps its own JUnit file).
      # `--workspace` like the run above: another package selection changes the feature set and builds again.
      - name: cargo nextest run (perf)
        run: cargo nextest run --workspace --locked --profile ci-perf -E 'binary_id(sandbox::perf)' -j 1
      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --workspace --doc --locked
      - name: JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci-perf/junit.xml
          if-no-files-found: warn
      - name: Keep what the run wrote
        if: failure()
        uses: ./.github/actions/upload-failure
        with:
          name: test

  # ---------------------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: clippy
      - name: cargo clippy (engine workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # What people copy must be clean too.
      - name: cargo clippy (template)
        run: cargo clippy --manifest-path template/Cargo.toml --all-targets --locked -- -D warnings
      - name: Keep what the run wrote
        if: failure()
        uses: ./.github/actions/upload-failure
        with:
          name: clippy

  # ---------------------------------------------------------------------------------------
  # The template is a workspace of its own (template/Cargo.toml has [workspace]) whose only
  # dependency is `shards`: it must build and pass its tests without the rest of the engine
  # repository, like a game in its own repository would.
  template:
    name: template
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: dev
          # Reuses the Bevy build of the `test` job (same dependency versions, same profile,
          # same target dir) and leaves the cache alone.
          save: "false"
      # The template has its own Cargo.lock. Dependencies must stay at the versions the
      # engine itself is built and tested with, so the two lockfiles may not disagree.
      - name: template/Cargo.lock agrees with Cargo.lock
        run: |
          python3 - <<'EOF'
          import sys, tomllib

          def versions(path):
              with open(path, "rb") as f:
                  return {(p["name"], p["version"]) for p in tomllib.load(f)["package"] if "source" in p}

          engine, template = versions("Cargo.lock"), versions("template/Cargo.lock")
          # Everything the template pins from a registry must be pinned the same way in the engine.
          drift = sorted(template - engine)
          if drift:
              sys.exit("template/Cargo.lock pins what Cargo.lock does not: " + ", ".join(f"{n} {v}" for n, v in drift)
                       + "\nResync it: cp Cargo.lock template/Cargo.lock && cargo metadata --manifest-path template/Cargo.toml --format-version 1 >/dev/null")
          print(f"ok: {len(template)} registry packages, all pinned like the engine's")
          EOF
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      # A separate workspace: nextest reads template/.config/nextest.toml (profile `ci`).
      - name: cargo nextest run (template)
        run: cargo nextest run --manifest-path template/Cargo.toml --locked --profile ci
      - name: JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-template
          # nextest keeps its store in `target/` of the workspace it runs for, not in CARGO_TARGET_DIR.
          path: template/target/nextest/ci/junit.xml
          if-no-files-found: warn
      # The game's own binary: its content is valid and its reference replays still match.
      - name: Content check and replay verification, through the game's binary
        working-directory: template
        run: |
          cargo run --locked -- --check-content
          for replay in tests/replays/*.json; do
            cargo run --locked -- --replay "$replay" --verify
          done
      # E5: the generated region passes its checks for 1000 seeds (exit 1 if any fails).
      - name: Worldgen report, 1000 seeds of the valley
        working-directory: template
        run: cargo run --locked -- --worldgen-report valley --seeds 1..1000
      - name: Keep what the run wrote
        if: failure()
        uses: ./.github/actions/upload-failure
        with:
          name: template

  # ---------------------------------------------------------------------------------------
  # A real game process, no window, played by the CLI the way an agent plays it.
  headless-cli:
    name: headless-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: dev
      - name: Build the sandbox and the CLI
        run: cargo build --locked -p sandbox -p shards_cli
      # Every content file, the level files tiles are built from (node by node) and the
      # navmesh bakes (a stale one names the tile to bake again).
      - name: Content check
        run: cargo sandbox --check-content
      # E5: the generated region passes its checks for 1000 seeds (exit 1 if any fails).
      - name: Worldgen report, 1000 seeds of the wilds
        run: cargo sandbox --worldgen-report wilds --seeds 1..1000
      # A2c: the voxel arena (a voxel region, 256 x 32 x 256 cells) passes its checks for 1000 seeds.
      - name: Worldgen report, 1000 seeds of the voxel arena
        run: cargo sandbox --worldgen-report voxel_arena --seeds 1..1000
      - name: Scenarios against a live game
        run: |
          port_file="$RUNNER_TEMP/game.port"
          log="$RUNNER_TEMP/game.log"
          game_pid=
          # SIGTERM, never -9: the game removes its token and port file on the way out. On a
          # failure the game's own log is what explains it.
          trap 'status=$?; if [ -n "$game_pid" ]; then kill "$game_pid" || true; fi; if [ "$status" -ne 0 ]; then cat "$log"; fi' EXIT
          cargo sandbox --headless --paused --port 0 --port-file "$port_file" > "$log" 2>&1 &
          # `cargo run` replaces itself with the game, so this is the game's pid from the start: the
          # trap ends a game that never came up, which `wait` could not have named.
          game_pid=$!
          # `shards wait` prints which game answered: "ready: tick 0 · pid 4242 · seed 42 · port 40817".
          ready=$(cargo shards --port-file "$port_file" wait --timeout 180)
          echo "$ready"
          cargo shards --port-file "$port_file" scenario crates/sandbox/scenarios/*.scenario
          # Then backwards, in the same game: each scenario sets up what it needs, whatever
          # ran before (a region loaded, a snapshot's tick).
          cargo shards --port-file "$port_file" scenario $(ls crates/sandbox/scenarios/*.scenario | sort -r)
      # E7 / E11.6: the stand scenarios (crates/sandbox/scenarios/stand/, outside the glob above:
      # a single game cannot run a file that names a host and clients) against live stands: a host
      # and clients, each a game of its own with its own `shards` port. Each file's `stand` line
      # names its stand (`stand clients=2 latency=150 loss=0.02`, or clean links), and a stand runs
      # only the files that want its links: the files are grouped by that line, and each group gets
      # a stand started with the same clients and `--net-sim` conditions. `wait --peer all` checks
      # that the members are one session.
      - name: Stand scenarios and a soak against live stands
        run: |
          log=
          stand_pid=
          stands=0
          # `stand stop` ends a stand the polite way; the signal is only for one that never came up.
          trap 'status=$?; if [ -n "$stand_pid" ]; then kill "$stand_pid" || true; fi; if [ "$status" -ne 0 ] && [ -n "$log" ]; then cat "$log"; fi' EXIT
          # Starts a stand from the words of a `stand` line (`clients=2 latency=150 loss=0.02`): the
          # other keys (latency, jitter, loss, dup) are the `--net-sim` spec, comma-separated.
          start_stand() {
            local clients= net= word
            for word in $1; do
              case "$word" in
                clients=*) clients=${word#clients=} ;;
                *) net="${net:+$net,}$word" ;;
              esac
            done
            stands=$((stands + 1))
            port_file="$RUNNER_TEMP/stand$stands.port"
            log="$RUNNER_TEMP/stand$stands.log"
            echo "== stand $stands: clients=$clients links=${net:-none}"
            cargo sandbox --stand "$clients" --headless --paused --port 0 --port-file "$port_file" ${net:+--net-sim "$net"} > "$log" 2>&1 &
            # The stand's pid from the start (`cargo run` replaces itself with the game): a stand
            # that never came up is the one the trap has to end.
            stand_pid=$!
            # One line per member: "member=c1 role=client player=1 body=e15 port=… pid=… seed=42 tick=14".
            cargo shards --port-file "$port_file" wait --peer all --timeout 180
          }
          stop_stand() {
            cargo shards --port-file "$port_file" stand
            cargo shards --port-file "$port_file" stand stop
            stand_pid=
          }
          declare -A group
          for file in crates/sandbox/scenarios/stand/*.scenario; do
            line=$(sed -n 's/^[[:space:]]*stand[[:space:]]\{1,\}//p' "$file" | head -n 1)
            if [ -z "$line" ]; then echo "::error file=$file::a stand scenario without a \`stand\` line"; exit 1; fi
            group[$line]+=" $file"
          done
          while IFS= read -r line; do
            start_stand "$line"
            cargo shards --port-file "$port_file" scenario ${group[$line]}
            stop_stand
          done < <(printf '%s\n' "${!group[@]}" | sort)
          # Three minutes of seeded play on every member of E7's stand (two clients, 150 ms one way,
          # 2% loss), the host changing the region and saving on the way: no member may desync
          # (soak.yml plays the half hour of E7's acceptance).
          start_stand "clients=2 latency=150 loss=0.02"
          cargo shards --port-file "$port_file" soak --seed 7 --minutes 3 --regen wilds --regen-minutes 1 --save-minutes 1
          stop_stand
      - name: Keep what the run wrote
        if: failure()
        uses: ./.github/actions/upload-failure
        with:
          name: headless-cli

  # ---------------------------------------------------------------------------------------
  # E1: the same replay matches with a window (under Xvfb, drawn by a software Vulkan driver)
  # and without. Slow and dependent on the runner's graphics stack, so it may fail without
  # failing the run until it has proved stable: then drop `continue-on-error`.
  #
  # `--windowed` exists now (crates/shards/src/run.rs). The job stays `continue-on-error`
  # because software rendering on the CI runners is not yet proven: a failure here may come
  # from the runner's graphics stack rather than from the engine.
  replays-window:
    name: replays-window
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: dev
          save: "false"
          packages: xvfb mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Build the sandbox and the template
        run: |
          cargo build --locked -p sandbox
          cargo build --locked --manifest-path template/Cargo.toml
      - name: Verify the sandbox's replays with a window
        run: |
          shopt -s nullglob
          replays=(tests/replays/*.json crates/sandbox/tests/replays/*.json)
          if [ ${#replays[@]} -eq 0 ]; then
            echo "::warning::no sandbox replays found in tests/replays/ or crates/sandbox/tests/replays/"
          fi
          for replay in "${replays[@]}"; do
            echo "== $replay"
            xvfb-run -a cargo sandbox --replay "$replay" --verify --windowed
          done
      - name: Verify the template's replays with a window
        working-directory: template
        run: |
          for replay in tests/replays/*.json; do
            echo "== $replay"
            xvfb-run -a cargo run --locked -- --replay "$replay" --verify --windowed
          done
      - name: Keep what the run wrote
        if: failure()
        uses: ./.github/actions/upload-failure
        with:
          name: replays-window
