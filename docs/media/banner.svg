<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Shards</title>
  <desc id="desc">A deterministic game engine in Rust that coding agents can play, test and debug from the terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#3f8fd8"/>
    </linearGradient>
    <linearGradient id="ice2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#2a5fb0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>

  <!-- The shards: flat low-poly crystals, as the engine's looks draw them. -->
  <g transform="translate(150 160)" stroke="#0b1020" stroke-width="3" stroke-linejoin="round">
    <polygon points="0,-118 40,-20 0,70 -38,-24" fill="url(#ice)"/>
    <polygon points="0,-118 40,-20 0,-6" fill="#e6f6ff" fill-opacity="0.55"/>
    <polygon points="-62,-40 -30,8 -52,92 -92,30" fill="url(#ice2)"/>
    <polygon points="62,-62 100,4 74,96 44,20" fill="url(#ice2)"/>
    <polygon points="62,-62 100,4 72,10" fill="#e6f6ff" fill-opacity="0.35"/>
  </g>
  <!-- A telegraph: the red zone an enemy's attack will hit. -->
  <ellipse cx="150" cy="276" rx="118" ry="16" fill="none" stroke="#ff5a4e" stroke-opacity="0.75" stroke-width="3"/>
  <ellipse cx="150" cy="276" rx="118" ry="16" fill="#ff5a4e" fill-opacity="0.12"/>

  <text x="300" y="150" fill="#f2f6ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="2">Shards</text>
  <text x="304" y="200" fill="#a9b8d6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28">A deterministic game engine in Rust that coding agents</text>
  <text x="304" y="236" fill="#a9b8d6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28">can play, test and debug from the terminal.</text>

  <rect x="304" y="258" width="474" height="36" rx="8" fill="#060912" stroke="#26324f"/>
  <text x="320" y="282" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="17"><tspan fill="#5fd38d">$</tspan><tspan fill="#d8e2f5"> shards step 300 --until "journal:winds up"</tspan></text>
</svg>
