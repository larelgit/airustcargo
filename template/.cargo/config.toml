# Do not point builds at another directory here (`[build] target-dir`): a game's
# `target/` lives next to its Cargo.toml.

# [build]
# Bevy builds slowly and hungrily. On a machine with little RAM limit the parallel jobs:
# jobs = 4

[target.x86_64-pc-windows-msvc]
# MSVC's own linker. Inside the engine's repository this folder would otherwise inherit the repository's
# `rust-lld` (cargo reads every `.cargo/config.toml` from the working folder up), and `shards package`, which
# builds from here, would ship a program linked differently from a game kept outside it. A game may switch
# its dev builds to `rust-lld` (docs/manual.md, "Building and iterating fast").
linker = "link.exe"

[alias]
# `cargo game` (window) · `cargo game --headless --paused` (no window, time stands still
# until `shards step`) · `cargo game --check-content`. Everything after `game` goes to
# `shards::run`.
game = "run --"
# There is no `cargo shards` here: install the CLI once, at the engine version this game
# depends on (see the README, "Driving the game with `shards`"), and run `shards observe`.
