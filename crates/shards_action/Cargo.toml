[package]
name = "shards_action"
description = "Shards actions and combat: data-driven action machine, hits, damage, fighter resources, statuses, telegraphs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The animation bridge (glTF clips follow the action machine), the combat overlay, the ground
# telegraphs and the off-screen warnings. They need a window to be seen; the pure logic behind
# them (clip choice, zone geometry, indicator placement) and the `animset` content kind are always
# built, so headless runs and `--check-content` know them too.
render = [
    "ai_core/render",
    "shards_motion/render",
    "bevy/bevy_animation",
    "bevy/bevy_gizmos",
    "bevy/bevy_gltf",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_world_serialization",
    "bevy/gltf_animation",
    "bevy/3d_bevy_render",
    "bevy/bevy_pbr",
]

[dependencies]
ai_core.workspace = true
shards_core.workspace = true
shards_content.workspace = true
shards_settings.workspace = true
shards_motion.workspace = true
shards_rules.workspace = true
shards_look.workspace = true
bevy = { workspace = true, features = ["std", "serialize"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# Reads glTF clips for content checks and the displacement bake (not public API).
gltf = { workspace = true, features = ["utils"] }

[dev-dependencies]
# Test apps load their content through the asset server, like a game.
bevy = { workspace = true, features = ["std", "serialize", "bevy_asset", "bevy_state", "multi_threaded"] }
ron.workspace = true
