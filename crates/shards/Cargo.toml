[package]
name = "shards"
description = "The Shards engine as one dependency: EnginePlugins, the standard main, test apps, prelude."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["render", "remote", "hot_reload"]
# Window, 3D rendering, UI, keyboard and mouse. Without it a game only runs headless.
render = [
    "ai_core/render",
    "shards_motion/render",
    "shards_action/render",
    "shards_level/render",
    "shards_world/render",
    "shards_npc/render",
    "shards_net/render",
    "shards_ui/render",
    "shards_dev/render",
    "shards_look/render",
    "shards_scatter/render",
    "shards_fx/render",
    "bevy/3d_bevy_render",
    "bevy/ui_bevy_render",
    "bevy/bevy_winit",
    "bevy/x11",
    "bevy/default_font",
    "bevy/keyboard",
    "bevy/mouse",
    "dep:winit",
]
# `ai/*` methods for the `shards` CLI (BRP on localhost, behind a token). Dev builds.
remote = ["ai_core/remote"]
# Content files apply as they change on disk (Bevy's file watcher).
hot_reload = ["shards_content/hot_reload"]
# Sound through the audio device (the audio module's playback; WAV and Ogg Vorbis). Without it the
# mixer and the music still decide what would play. Needs libasound2-dev on Linux.
audio = ["shards_audio/playback"]
gamepad = ["bevy/bevy_gilrs", "shards_motion/gamepad"]
wayland = ["bevy/wayland"]
# Faster incremental builds (`--features dynamic`).
dynamic = ["bevy/dynamic_linking"]
# Tracy profiler zones for every system (`--features trace_tracy`; connect the Tracy client).
trace_tracy = ["bevy/trace_tracy"]
# A build for players (`shards package`): the developer's keys (console, menu, overlays) do nothing.
# Build it without `remote` and `hot_reload`.
dist = ["shards_core/dist"]
# Steam (E10.5): lobbies and invites, co-op over the Steam relay (`--steam-host`, `--steam-server`,
# `--join steam:<id>`), achievements (`*.achievement.ron`), saves mirrored to Steam Cloud. On its own the
# module runs on a fake Steam in the process (tests; a game a player runs says it has no Steam);
# `steam_sdk` adds the real one.
steam = ["dep:shards_steam"]
# `steam` on the real Steam client: links Valve's steam_api64 (a program that does not start without
# the DLL beside it; `shards package` puts it there). A game a player plays then talks to Steam.
steam_sdk = ["steam", "shards_steam/sdk"]

[dependencies]
ai_core.workspace = true
shards_core.workspace = true
shards_content.workspace = true
shards_motion.workspace = true
shards_action.workspace = true
shards_level.workspace = true
shards_npc.workspace = true
shards_encounter.workspace = true
shards_world.workspace = true
shards_save.workspace = true
shards_net.workspace = true
shards_script.workspace = true
shards_settings.workspace = true
shards_locale.workspace = true
shards_ui.workspace = true
shards_audio.workspace = true
shards_dev.workspace = true
shards_look.workspace = true
shards_scatter.workspace = true
shards_voxel.workspace = true
shards_fx.workspace = true
shards_hitstop.workspace = true
shards_rules.workspace = true
shards_steam = { workspace = true, optional = true }
bevy = { workspace = true, features = ["default_app", "std", "multi_threaded", "serialize"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap.workspace = true
# The window's icon (`render`).
winit = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `kill` and a closed terminal end the game through `AppExit` (see `run`).
libc.workspace = true
