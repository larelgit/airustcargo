[package]
name = "shards_npc"
description = "Shards NPC AI: behaviour state machines in content, perception, combat director with attack tokens, attack planner, navigation (baked tile grids stitched over the region), nav agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The navigation overlay (walkable cells, portals, links and NPC routes drawn with gizmos).
render = ["ai_core/render", "shards_motion/render", "shards_world/render", "bevy/bevy_gizmos"]

[dependencies]
ai_core.workspace = true
shards_core.workspace = true
shards_content.workspace = true
shards_motion.workspace = true
shards_action.workspace = true
# The region's tile graph and active zones; level files of tiles and their navlinks.
shards_world.workspace = true
shards_level.workspace = true
bevy = { workspace = true, features = ["std", "serialize"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# Bake files: a RON header around the packed grid.
ron.workspace = true

[dev-dependencies]
# Test apps load their content through the asset server, like a game.
bevy = { workspace = true, features = ["std", "serialize", "bevy_asset", "bevy_state", "multi_threaded"] }
