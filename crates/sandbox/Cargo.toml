[package]
name = "sandbox"
description = "Test arena for the Shards engine: player, skeletons and the Frost Warden boss."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["render", "remote", "hot_reload"]
remote = ["shards/remote"]
# Window, 3D rendering, UI. Without it the game only runs `--headless`.
render = ["shards/render"]
# Content files apply as they change on disk.
hot_reload = ["shards/hot_reload"]
# Need system packages: libasound2-dev / libudev-dev / libwayland-dev libxkbcommon-dev.
audio = ["shards/audio"]
gamepad = ["shards/gamepad"]
wayland = ["shards/wayland"]
# Faster incremental builds (`cargo sandbox --features dynamic`).
dynamic = ["shards/dynamic"]

[dependencies]
# Like a game: the engine is one dependency.
shards.workspace = true

[dev-dependencies]
# The writer of the region's level files (`tests/sandbox/tiles.rs`, shared with shards_level's
# tests) builds glTF JSON.
serde_json.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# The shutdown test sends signals to a running game.
libc.workspace = true
