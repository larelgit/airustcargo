[package]
name = "shards_rules"
description = "Shards rules (G10, C3): rule sets a world plays one at a time, by class and by session size, changed only out of combat and only by the host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ai_core.workspace = true
shards_core.workspace = true
shards_content.workspace = true
shards_locale.workspace = true
bevy = { workspace = true, features = ["std", "serialize", "bevy_state"] }
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
# Integration tests build apps the way a game does: the whole engine (`shards::testing`).
shards = { workspace = true, features = ["render", "remote", "hot_reload"] }
